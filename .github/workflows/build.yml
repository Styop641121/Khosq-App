name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show project files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 \( -name "settings.gradle*" -o -name "build.gradle*" -o -name "gradlew" \) -not -path "./.git/*"

      - name: Build Debug APK
        run: |
          SETTINGS=$(find . -maxdepth 3 -name "settings.gradle*" -not -path "./.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle(.kts) not found: project structure is incomplete"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          cd "$DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khosq-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
