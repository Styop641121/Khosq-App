<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<!-- The page holds a key: it may load scripts only from itself and from Google's Firebase address, and talk only to the KHOSQ Worker and Firebase. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src blob:; connect-src 'self' https://*.workers.dev https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com stun: turn: turns:; base-uri 'none'; form-action 'none'">
<title>KHOSQ Web</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="32" height="32"><span>KHOSQ <b>Web</b></span></div>
  <div class="langs" id="langs" role="group" aria-label="Language"></div>
</header>

<main id="boot" class="center"><div class="spinner" aria-hidden="true"></div></main>

<main id="login" class="wrap" hidden>
  <section class="card login">
    <div class="intro">
      <h1 data-i18n="loginTitle"></h1>
      <p class="muted" data-i18n="tagline"></p>
      <ol class="steps">
        <li><span>1</span><p data-i18n="step1"></p></li>
        <li><span>2</span><p data-i18n="step2"></p></li>
        <li><span>3</span><p data-i18n="step3"></p></li>
        <li><span>4</span><p><span data-i18n="step4"></span> <b class="code" id="code" aria-live="polite"></b></p></li>
      </ol>
      <p class="note" data-i18n="privacy"></p>
    </div>
    <div class="scan">
      <div class="qrbox" id="qr" aria-label="QR"></div>
      <p class="status" id="status" role="status"></p>
      <button class="btn ghost" id="refresh" type="button" data-i18n="refresh"></button>
      <button class="btn" id="retry" type="button" data-i18n="retry" hidden></button>
      <p class="muted small" data-i18n="changes"></p>
    </div>
  </section>
</main>

<main id="app" class="app" hidden>
  <aside class="side">
    <div class="side-top">
      <button class="mebtn" id="meBtn" type="button" data-i18n-title="about"></button>
      <button class="hbtn" id="starBtn" type="button" aria-haspopup="dialog" data-i18n-aria="starsTitle" data-i18n-title="starsTitle">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m12 3.2 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <button class="plus" id="newBtn" type="button" data-i18n-aria="newChat" data-i18n-title="newChat">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="search"><input id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="search" data-i18n-aria="search"></div>
    <div class="chips" id="chips" role="group"></div>
    <p class="hint" id="listLoading" data-i18n="loadingChats"></p>
    <ul class="list" id="list"></ul>
    <p class="hint" id="listEmpty" hidden></p>
  </aside>
  <section class="pane">
    <div class="pane-empty" id="paneEmpty">
      <div class="big" aria-hidden="true">💬</div>
      <h2 data-i18n="pickChat"></h2>
      <p class="muted" data-i18n="paneNote"></p>
    </div>
    <div class="chat" id="chat" hidden>
      <header class="chat-top">
        <button class="icon-btn back" id="back" type="button" data-i18n-aria="back">‹</button>
        <span id="chAv"></span>
        <div class="who2"><b id="chName"></b><small id="chSub"></small></div>
        <button class="hbtn" id="callBtn" type="button" hidden data-i18n-aria="callBtn" data-i18n-title="callBtn">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="currentColor"/></svg>
        </button>
        <button class="hbtn" id="vidBtn" type="button" hidden data-i18n-aria="vidBtn" data-i18n-title="vidBtn">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z" fill="currentColor"/></svg>
        </button>
        <button class="hbtn" id="chatMore" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="chatMenu" data-i18n-title="chatMenu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" fill="currentColor"/></svg>
        </button>
      </header>
      <p class="warn" id="warn" role="alert" hidden><span id="warnText"></span><button class="btn ghost" id="warnOk" type="button" data-i18n="ackKey"></button></p>
      <div class="pinbar" id="pinBar" hidden>
        <button class="pin-go" id="pinGo" type="button" data-i18n-aria="pinGo">
          <b data-i18n="pinnedMsg"></b>
          <span id="pinText"></span>
        </button>
        <button class="icon-btn" id="pinX" type="button" data-i18n-aria="pinOff" data-i18n-title="pinOff">✕</button>
      </div>
      <div class="msgs" id="msgs">
        <button class="btn ghost more" id="older" type="button" data-i18n="older" hidden></button>
        <p class="hint" id="msgLoading" data-i18n="loadingMsgs" hidden></p>
        <p class="hint" id="noMsgs" hidden></p>
        <div id="msgList"></div>
      </div>
      <footer class="compose" id="compose">
        <div class="replybar" id="replyBar" hidden>
          <div class="rq"><b id="replyName"></b><span id="replyText"></span></div>
          <button class="icon-btn" id="replyX" type="button" data-i18n-aria="cancelReply">✕</button>
        </div>
        <div class="replybar editbar" id="editBar" hidden>
          <div class="rq"><b data-i18n="editing"></b><span id="editText"></span></div>
          <button class="icon-btn" id="editX" type="button" data-i18n-aria="cancelEdit">✕</button>
        </div>
        <div class="replybar mediabar" id="mediaBar" role="group" hidden>
          <img class="thumb" id="mediaThumb" alt="" hidden>
          <span class="rec-dot" id="mediaDot" aria-hidden="true" hidden></span>
          <div class="rq"><b id="mediaTitle"></b><span id="mediaInfo"></span></div>
          <button class="btn" id="mediaSend" type="button" data-i18n="send"></button>
          <button class="icon-btn" id="mediaX" type="button" data-i18n-aria="cancel">✕</button>
        </div>
        <div class="notice" id="notice" role="group" hidden>
          <p class="nt" id="noticeText"></p>
          <p class="nn" id="noticeNote" hidden></p>
          <div class="btns"><button class="btn danger" id="noticeNo" type="button"></button><button class="btn" id="noticeYes" type="button"></button></div>
        </div>
        <p class="waitnote" id="waitNote" role="status" hidden></p>
        <p class="cant" id="cant" role="status" hidden></p>
        <div class="cmp" id="cmp">
          <button class="clip" id="photoBtn" type="button" data-i18n-aria="addPhoto" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h3l1.6-2h6.8L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm8 2.2A3.8 3.8 0 1 0 12 16.8 3.8 3.8 0 0 0 12 9.2zm0 1.8a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="currentColor"/></svg>
          </button>
          <input type="file" id="photoIn" accept="image/*" hidden>
          <textarea id="msgIn" rows="1" maxlength="4000" autocomplete="off" enterkeyhint="send" data-i18n-ph="writeMsg" data-i18n-aria="writeMsg"></textarea>
          <button class="clip" id="micBtn" type="button" data-i18n-aria="voice" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z" fill="currentColor"/></svg>
          </button>
          <button class="send" id="sendBtn" type="button" data-i18n-aria="send" disabled>
            <svg class="i-send" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.3 10.1 15 12 3.3 13.9z" fill="currentColor"/></svg>
            <svg class="i-save" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9.2 16.6 4.9 12.3l-1.4 1.4 5.7 5.7L20.5 8.1l-1.4-1.4z" fill="currentColor"/></svg>
          </button>
        </div>
      </footer>
    </div>
  </section>
</main>

<section id="call" class="callpanel" role="group" hidden>
  <div class="cp-video" id="cpVideo" hidden>
    <video id="cpRemote" autoplay playsinline></video>
    <video id="cpLocal" class="cp-self" autoplay playsinline muted></video>
  </div>
  <audio id="cpAudio" autoplay></audio>
  <div class="cp-row">
    <span class="cp-av" id="cpAv"></span>
    <div class="cp-who"><b id="callName"></b><small id="cpStatus" role="status" aria-live="polite"></small></div>
  </div>
  <div class="cp-btns">
    <button class="cp-btn" id="cpMute" type="button" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z" fill="currentColor"/><path class="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span class="lb"></span>
    </button>
    <button class="cp-btn" id="cpCam" type="button" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z" fill="currentColor"/><path class="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span class="lb"></span>
    </button>
    <button class="cp-btn red" id="cpEnd" type="button">
      <svg class="hang" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="currentColor"/></svg><span class="lb"></span>
    </button>
    <button class="cp-btn green" id="cpAccept" type="button" hidden>
      <svg class="ans" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="currentColor"/></svg><span class="lb"></span>
    </button>
  </div>
</section>

<dialog id="about" class="about">
  <div class="me">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <div>
      <h1 id="name"></h1>
      <p class="muted" id="handle"></p>
    </div>
  </div>
  <h2 data-i18n="homeTitle"></h2>
  <ul class="checks" id="checks"></ul>
  <p class="muted" id="keyid"></p>
  <p class="muted" data-i18n="homeNext"></p>
  <div class="row spread">
    <button class="btn danger" id="logout" type="button" data-i18n="logout"></button>
    <button class="btn ghost" id="aboutClose" type="button" data-i18n="close"></button>
  </div>
</dialog>

<div class="menu" id="menu" role="menu" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="newChat" class="newchat" aria-labelledby="ncTitle">
  <h2 id="ncTitle" data-i18n="ncTitle"></h2>
  <label class="ncl" for="ncId" data-i18n="ncLabel"></label>
  <input id="ncId" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="30" enterkeyhint="go">
  <p class="small" id="ncMine"></p>
  <p class="ncerr" id="ncErr" role="alert" hidden></p>
  <button class="linkbtn" id="ncGroup" type="button" data-i18n="ncGroup"></button>
  <div class="row">
    <button class="btn ghost" id="ncNo" type="button" data-i18n="cancel"></button>
    <button class="btn" id="ncGo" type="button" data-i18n="ncGo"></button>
  </div>
</dialog>

<dialog id="fwd" class="pick" aria-labelledby="fwdTitle">
  <h2 id="fwdTitle" data-i18n="fwdTitle"></h2>
  <p class="small" id="fwdNone" data-i18n="fwdNone" hidden></p>
  <ul class="picks" id="fwdList"></ul>
  <div class="row">
    <button class="btn ghost" id="fwdNo" type="button" data-i18n="cancel"></button>
    <button class="btn" id="fwdGo" type="button" disabled></button>
  </div>
</dialog>

<dialog id="newGroup" class="pick newgroup" aria-labelledby="ngTitle">
  <h2 id="ngTitle" data-i18n="ngTitle"></h2>
  <label class="ncl" for="ngName" data-i18n="ngName"></label>
  <input id="ngName" type="text" maxlength="40" autocomplete="off" enterkeyhint="done">
  <p class="small" id="ngNone" data-i18n="ngNone" hidden></p>
  <p class="small" id="ngCount"></p>
  <ul class="picks" id="ngList"></ul>
  <p class="ncerr" id="ngErr" role="alert" hidden></p>
  <div class="row">
    <button class="btn ghost" id="ngNo" type="button" data-i18n="cancel"></button>
    <button class="btn" id="ngGo" type="button" disabled></button>
  </div>
</dialog>

<dialog id="ginfo" class="pick ginfo" aria-labelledby="giName">
  <div class="gi-head">
    <span class="gi-av" id="giAv"></span>
    <div class="gi-who"><h2 id="giName"></h2><small id="giSub"></small></div>
    <button class="icon-btn" id="giX" type="button" data-i18n-aria="close">✕</button>
  </div>
  <div class="gi-desc" id="giDescBox" hidden><b data-i18n="giDesc"></b><p id="giDesc"></p></div>
  <div class="gi-acts" id="giActs" hidden>
    <button class="gbtn" id="giPhoto" type="button" data-i18n="giPhoto"></button>
    <button class="gbtn danger" id="giPhotoX" type="button" data-i18n="giPhotoX" hidden></button>
    <button class="gbtn" id="giDescB" type="button" data-i18n="giDescEdit"></button>
    <button class="gbtn" id="giRenameB" type="button" data-i18n="giRename"></button>
    <button class="gbtn" id="giModeB" type="button" role="switch" aria-checked="false"><span data-i18n="giMode"></span><small id="giModeNote"></small></button>
    <button class="gbtn" id="giAddB" type="button" data-i18n="giAdd"></button>
    <p class="small" data-i18n="giNoLink"></p>
  </div>
  <div class="gi-edit" id="giEdit" hidden>
    <label class="ncl" id="giEditLb" for="giEditIn"></label>
    <input id="giEditIn" type="text" maxlength="40" autocomplete="off" enterkeyhint="done">
    <textarea id="giEditTa" rows="3" maxlength="200" autocomplete="off" hidden></textarea>
    <div class="row">
      <button class="btn ghost" id="giEditNo" type="button" data-i18n="cancel"></button>
      <button class="btn" id="giEditGo" type="button" data-i18n="save"></button>
    </div>
  </div>
  <div class="gi-add" id="giAdd" hidden>
    <p class="small" id="giAddNone" data-i18n="giAddNone" hidden></p>
    <ul class="picks" id="giAddList"></ul>
    <div class="row">
      <button class="btn ghost" id="giAddNo" type="button" data-i18n="cancel"></button>
      <button class="btn" id="giAddGo" type="button" disabled></button>
    </div>
  </div>
  <h3 class="gi-h" data-i18n="giMembers"></h3>
  <ul class="gi-members" id="giMembers"></ul>
  <p class="ncerr" id="giErr" role="alert" hidden></p>
  <div class="gi-ask" id="giAsk" role="group" hidden>
    <p id="giAskText"></p>
    <div class="row">
      <button class="btn ghost" id="giAskNo" type="button" data-i18n="cancel"></button>
      <button class="btn danger" id="giAskYes" type="button"></button>
    </div>
  </div>
  <div class="row spread gi-foot">
    <button class="btn danger" id="giLeave" type="button" data-i18n="giLeave"></button>
    <button class="btn ghost" id="giClose" type="button" data-i18n="close"></button>
  </div>
  <input type="file" id="giFile" accept="image/*" hidden>
</dialog>

<dialog id="starred" class="pick starred" aria-labelledby="stTitle">
  <div class="st-head">
    <h2 id="stTitle" data-i18n="starsTitle"></h2>
    <button class="icon-btn" id="stClose" type="button" data-i18n-aria="close">✕</button>
  </div>
  <p class="hint" id="stNote" hidden></p>
  <ul class="picks stars" id="stList"></ul>
</dialog>

<dialog id="shot" class="shot"><img id="shotImg" alt=""></dialog>

<dialog id="ask">
  <p id="askText"></p>
  <div class="row">
    <button class="btn ghost" id="askNo" type="button" data-i18n="cancel"></button>
    <button class="btn danger" id="askYes" type="button" data-i18n="logout"></button>
  </div>
</dialog>

<noscript><p class="center">KHOSQ Web needs JavaScript.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
