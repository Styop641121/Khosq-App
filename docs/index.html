<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<!-- The page holds a key: it may load scripts only from itself and from Google's Firebase address, and talk only to the KHOSQ Worker and Firebase. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src blob:; connect-src 'self' https://*.workers.dev https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; base-uri 'none'; form-action 'none'">
<title>KHOSQ Web</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="32" height="32"><span>KHOSQ <b>Web</b></span></div>
  <div class="langs" id="langs" role="group" aria-label="Language"></div>
</header>

<main id="boot" class="center"><div class="spinner" aria-hidden="true"></div></main>

<main id="login" class="wrap" hidden>
  <section class="card login">
    <div class="intro">
      <h1 data-i18n="loginTitle"></h1>
      <p class="muted" data-i18n="tagline"></p>
      <ol class="steps">
        <li><span>1</span><p data-i18n="step1"></p></li>
        <li><span>2</span><p data-i18n="step2"></p></li>
        <li><span>3</span><p data-i18n="step3"></p></li>
        <li><span>4</span><p><span data-i18n="step4"></span> <b class="code" id="code" aria-live="polite"></b></p></li>
      </ol>
      <p class="note" data-i18n="privacy"></p>
    </div>
    <div class="scan">
      <div class="qrbox" id="qr" aria-label="QR"></div>
      <p class="status" id="status" role="status"></p>
      <button class="btn ghost" id="refresh" type="button" data-i18n="refresh"></button>
      <button class="btn" id="retry" type="button" data-i18n="retry" hidden></button>
      <p class="muted small" data-i18n="changes"></p>
    </div>
  </section>
</main>

<main id="app" class="app" hidden>
  <aside class="side">
    <div class="side-top">
      <button class="mebtn" id="meBtn" type="button" data-i18n-title="about"></button>
    </div>
    <div class="search"><input id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="search" data-i18n-aria="search"></div>
    <div class="chips" id="chips" role="group"></div>
    <p class="hint" id="listLoading" data-i18n="loadingChats"></p>
    <ul class="list" id="list"></ul>
    <p class="hint" id="listEmpty" hidden></p>
  </aside>
  <section class="pane">
    <div class="pane-empty" id="paneEmpty">
      <div class="big" aria-hidden="true">💬</div>
      <h2 data-i18n="pickChat"></h2>
      <p class="muted" data-i18n="paneNote"></p>
    </div>
    <div class="chat" id="chat" hidden>
      <header class="chat-top">
        <button class="icon-btn back" id="back" type="button" data-i18n-aria="back">‹</button>
        <span id="chAv"></span>
        <div class="who2"><b id="chName"></b><small id="chSub"></small></div>
      </header>
      <p class="warn" id="warn" role="alert" hidden><span id="warnText"></span><button class="btn ghost" id="warnOk" type="button" data-i18n="ackKey"></button></p>
      <div class="msgs" id="msgs">
        <button class="btn ghost more" id="older" type="button" data-i18n="older" hidden></button>
        <p class="hint" id="msgLoading" data-i18n="loadingMsgs" hidden></p>
        <p class="hint" id="noMsgs" hidden></p>
        <div id="msgList"></div>
      </div>
      <footer class="compose" id="compose">
        <div class="replybar" id="replyBar" hidden>
          <div class="rq"><b id="replyName"></b><span id="replyText"></span></div>
          <button class="icon-btn" id="replyX" type="button" data-i18n-aria="cancelReply">✕</button>
        </div>
        <div class="replybar editbar" id="editBar" hidden>
          <div class="rq"><b data-i18n="editing"></b><span id="editText"></span></div>
          <button class="icon-btn" id="editX" type="button" data-i18n-aria="cancelEdit">✕</button>
        </div>
        <div class="replybar mediabar" id="mediaBar" role="group" hidden>
          <img class="thumb" id="mediaThumb" alt="" hidden>
          <span class="rec-dot" id="mediaDot" aria-hidden="true" hidden></span>
          <div class="rq"><b id="mediaTitle"></b><span id="mediaInfo"></span></div>
          <button class="btn" id="mediaSend" type="button" data-i18n="send"></button>
          <button class="icon-btn" id="mediaX" type="button" data-i18n-aria="cancel">✕</button>
        </div>
        <p class="cant" id="cant" role="status" hidden></p>
        <div class="cmp" id="cmp">
          <button class="clip" id="photoBtn" type="button" data-i18n-aria="addPhoto" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h3l1.6-2h6.8L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm8 2.2A3.8 3.8 0 1 0 12 16.8 3.8 3.8 0 0 0 12 9.2zm0 1.8a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="currentColor"/></svg>
          </button>
          <input type="file" id="photoIn" accept="image/*" hidden>
          <textarea id="msgIn" rows="1" maxlength="4000" autocomplete="off" enterkeyhint="send" data-i18n-ph="writeMsg" data-i18n-aria="writeMsg"></textarea>
          <button class="clip" id="micBtn" type="button" data-i18n-aria="voice" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z" fill="currentColor"/></svg>
          </button>
          <button class="send" id="sendBtn" type="button" data-i18n-aria="send" disabled>
            <svg class="i-send" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.3 10.1 15 12 3.3 13.9z" fill="currentColor"/></svg>
            <svg class="i-save" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9.2 16.6 4.9 12.3l-1.4 1.4 5.7 5.7L20.5 8.1l-1.4-1.4z" fill="currentColor"/></svg>
          </button>
        </div>
      </footer>
    </div>
  </section>
</main>

<dialog id="about" class="about">
  <div class="me">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <div>
      <h1 id="name"></h1>
      <p class="muted" id="handle"></p>
    </div>
  </div>
  <h2 data-i18n="homeTitle"></h2>
  <ul class="checks" id="checks"></ul>
  <p class="muted" id="keyid"></p>
  <p class="muted" data-i18n="homeNext"></p>
  <div class="row spread">
    <button class="btn danger" id="logout" type="button" data-i18n="logout"></button>
    <button class="btn ghost" id="aboutClose" type="button" data-i18n="close"></button>
  </div>
</dialog>

<div class="menu" id="menu" role="menu" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="shot" class="shot"><img id="shotImg" alt=""></dialog>

<dialog id="ask">
  <p id="askText"></p>
  <div class="row">
    <button class="btn ghost" id="askNo" type="button" data-i18n="cancel"></button>
    <button class="btn danger" id="askYes" type="button" data-i18n="logout"></button>
  </div>
</dialog>

<noscript><p class="center">KHOSQ Web needs JavaScript.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
